<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Postenza</title>
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='brand/postenza-favicon-16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='brand/postenza-favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='brand/postenza-favicon-48.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='brand/postenza-icon-192.png') }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='brand/postenza-favicon.png') }}">
    <style>
        :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0b0b0e; color: #f5f5f7; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
        main { width: min(100%, 420px); background: #16161b; border: 1px solid #2b2b33; border-radius: 18px; padding: 30px; }
        h1 { margin: 0 0 8px; } p { color: #b8bbc7; line-height: 1.5; }
        label { display: grid; gap: 7px; margin-top: 16px; font-weight: 700; }
        input { border: 1px solid #3a3a44; border-radius: 9px; padding: 12px; color: inherit; background: #0f0f13; font: inherit; }
        button { margin-top: 22px; width: 100%; border: 0; border-radius: 9px; padding: 12px; background: #bc83ff; color: #170524; font-weight: 800; font: inherit; cursor: pointer; }
        .error { margin: 16px 0 0; border-left: 3px solid #ff718c; padding-left: 10px; color: #ffbdc8; } a { color: #d5afff; }
    </style>
</head>
<body>
    <main>
        <img src="{{ url_for('static', filename='brand/postenza-logo-dark.png') }}" alt="Postenza" style="width:100%;height:auto;margin-bottom:18px">
        <h1>Create your account</h1>
        <p>Your account starts without access to an Instagram workspace.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label>Display name<input name="display_name" autocomplete="name" maxlength="80" required></label>
            <label>Email<input name="email" type="email" autocomplete="email" required></label>
            <label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
            <button type="submit">Create account</button>
        </form>
        <p>Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p>
    </main>
</body>
</html>
