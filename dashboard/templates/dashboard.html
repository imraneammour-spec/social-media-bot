<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMRAN PROMPTS — Dashboard</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0b0d; color: #f5f5f7; font-family: Arial, sans-serif; min-height: 100vh; }
        .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
        .sidebar { border-right: 1px solid #24242a; background: #111114; padding: 28px 18px; }
        .logo { font-size: 18px; font-weight: 800; margin-bottom: 40px; }
        .logo span { color: #888892; }
        .nav { display: grid; gap: 8px; }
        .nav button { border: 0; background: transparent; color: #aaaab4; text-align: left; padding: 13px 14px; border-radius: 12px; cursor: pointer; font-size: 14px; }
        .nav button.active { background: #202025; color: white; }
        .main { padding: 32px; max-width: 1250px; width: 100%; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-size: 30px; }
        .status { color: #8d8d96; font-size: 13px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
        .card { background: #151518; border: 1px solid #29292f; border-radius: 20px; padding: 22px; }
        .card h2 { font-size: 17px; margin-bottom: 18px; }
        .upload { border: 1px dashed #3b3b44; border-radius: 16px; min-height: 250px; display: grid; place-items: center; text-align: center; cursor: pointer; color: #9999a3; padding: 25px; }
        .upload:hover { border-color: #656570; }
        input[type="file"] { display: none; }
        textarea, input[type="text"], input[type="datetime-local"] { width: 100%; background: #0f0f12; color: white; border: 1px solid #303038; border-radius: 12px; padding: 13px; margin-bottom: 14px; outline: none; font-family: inherit; }
        textarea { min-height: 125px; resize: vertical; }
        label { display: block; color: #aaaab3; font-size: 12px; margin-bottom: 7px; }
        .btn { width: 100%; padding: 13px 16px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 700; margin-top: 8px; }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn-primary { background: white; color: #111; }
        .btn-secondary { background: #27272d; color: white; }
        .approval { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .approve { background: #ffffff; color: #111; }
        .reject { background: #2a2a30; color: #ddd; }
        .preview-images { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
        .preview-images img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 1px solid #333; }
        .section-title { margin: 28px 0 15px; color: #aaaab4; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
        .draft { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding: 14px 0; border-bottom: 1px solid #26262c; }
        .draft:last-child { border-bottom: 0; }
        .draft-content { min-width: 0; }
        .draft-title { font-weight: 700; margin-bottom: 6px; }
        .draft-caption { color: #a3a3ad; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 720px; }
        .badge { background: #29292f; padding: 7px 10px; border-radius: 999px; font-size: 11px; color: #aaaab3; text-transform: capitalize; white-space: nowrap; }
        .message { display: none; margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 13px; }
        .message.success { display: block; background: #18251d; border: 1px solid #2a5034; }
        .message.error { display: block; background: #2b1818; border: 1px solid #633333; }
        .empty-drafts { color: #8d8d96; font-size: 13px; }
        .hidden { display: none !important; }
        .stats-grid { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:14px; margin-bottom:22px; }
        .stat-card { background:#151518; border:1px solid #29292f; border-radius:16px; padding:18px; }
        .stat-value { font-size:28px; font-weight:800; margin-bottom:6px; }
        .stat-label { font-size:12px; color:#9999a3; text-transform:uppercase; letter-spacing:.06em; }
        .view-note { color:#8d8d96; font-size:13px; margin-top:6px; }
        .published-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
        .published-card { background:#111114; border:1px solid #2b2b31; border-radius:16px; overflow:hidden; }
        .published-image { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#0f0f12; }
        .published-body { padding:16px; }
        .published-caption { color:#d8d8de; font-size:13px; line-height:1.45; margin-bottom:12px; }
        .published-meta { display:grid; gap:6px; color:#92929c; font-size:11px; margin-bottom:14px; word-break:break-all; }
        .published-actions { display:flex; gap:8px; align-items:center; }
        .published-actions button { border:0; border-radius:10px; padding:9px 12px; cursor:pointer; font-weight:700; }
        .published-open { background:#fff; color:#111; }
        .published-open:disabled { opacity:.55; cursor:not-allowed; }
        @media(max-width:850px) { .published-grid { grid-template-columns:1fr; } }
        @media(max-width: 850px) { .stats-grid { grid-template-columns:1fr 1fr; } }
        @media(max-width: 850px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } .grid { grid-template-columns: 1fr; } .main { padding: 18px; } }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">IMRAN <span>PROMPTS</span></div>
        <div class="nav">
            <button class="active" data-view="dashboard">Dashboard</button>
            <button data-view="new">New Post</button>
            <button data-view="drafts">Drafts</button>
            <button data-view="scheduled">Scheduled</button>
            <button data-view="published">Published</button>
            <button data-view="analytics">Analytics</button>
        </div>
    </aside>

    <main class="main">
        <div class="header">
            <div>
                <h1 id="pageTitle">Content Dashboard</h1>
                <div id="pageSubtitle" class="status">Instagram automation • Online</div>
            </div>
        </div>

        <div id="composerSection">
        <div class="grid">
            <section class="card">
                <h2>1. Upload Post</h2>
                <label class="upload" for="images">
                    <div><strong>Upload images</strong><br><br>Click here to select your Instagram post images.</div>
                </label>
                <input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple>
                <div id="preview" class="preview-images"></div>
                <button id="generateButton" class="btn btn-primary" type="button">Generate with Gemini ✨</button>
                <div id="generationMessage" class="message"></div>
            </section>

            <section class="card">
                <h2>2. AI Content</h2>
                <label>Caption</label>
                <textarea id="caption" placeholder="Gemini will generate the Instagram caption here..."></textarea>
                <label>Call to Action</label>
                <input id="cta" type="text" placeholder="Example: Comment AI and I’ll send you the prompt.">
                <label>Hashtags</label>
                <textarea id="hashtags" placeholder="#ai #aiprompts #aiphotography" style="min-height:80px;"></textarea>
                <div class="approval">
                    <button id="approveButton" class="btn approve" type="button">Approve ✓</button>
                    <button id="rejectButton" class="btn reject" type="button">Reject</button>
                </div>
            </section>
        </div>

        <div class="section-title">Publishing</div>
        <section class="card">
            <div class="grid">
                <div>
                    <label>Publish date & time</label>
                    <input id="schedule" type="datetime-local">
                </div>
                <div>
                    <label>Publishing action</label>
                    <button id="scheduleButton" class="btn btn-secondary" type="button">Schedule Post</button>
                    <button id="publishButton" class="btn btn-primary" type="button">Publish Now</button>
                </div>
            </div>
        </section>

        </div>

        <div id="analyticsSection" class="hidden">
            <div class="stats-grid">
                <div class="stat-card"><div id="statTotal" class="stat-value">0</div><div class="stat-label">Total</div></div>
                <div class="stat-card"><div id="statDrafts" class="stat-value">0</div><div class="stat-label">Drafts</div></div>
                <div class="stat-card"><div id="statScheduled" class="stat-value">0</div><div class="stat-label">Scheduled</div></div>
                <div class="stat-card"><div id="statPublished" class="stat-value">0</div><div class="stat-label">Published</div></div>
            </div>
            <section class="card">
                <h2>Content overview</h2>
                <div id="analyticsText" class="view-note">Loading analytics...</div>
            </section>
        </div>

        <div id="listSection">
        <div id="listTitle" class="section-title">Recent Drafts</div>
        <section class="card">
            <div id="draftsList" class="empty-drafts">Loading drafts...</div>
        </section>
        </div>
    </main>
</div>

<script>
const imageInput = document.getElementById("images");
const preview = document.getElementById("preview");
const generateButton = document.getElementById("generateButton");
const generationMessage = document.getElementById("generationMessage");
const caption = document.getElementById("caption");
const cta = document.getElementById("cta");
const hashtags = document.getElementById("hashtags");
const approveButton = document.getElementById("approveButton");
const draftsList = document.getElementById("draftsList");
const composerSection = document.getElementById("composerSection");
const analyticsSection = document.getElementById("analyticsSection");
const listSection = document.getElementById("listSection");
const listTitle = document.getElementById("listTitle");
const pageTitle = document.getElementById("pageTitle");
const pageSubtitle = document.getElementById("pageSubtitle");
const navButtons = Array.from(document.querySelectorAll(".nav button[data-view]"));
let currentDraftId = "";
let currentView = "dashboard";
let cachedDrafts = [];

function setMessage(type, text) {
    generationMessage.className = "message" + (type ? " " + type : "");
    generationMessage.textContent = text || "";
}

async function fileToInstagramJpeg(file, index) {
    const objectUrl = URL.createObjectURL(file);

    try {
        const image = await new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error(`Could not read image ${index}.`));
            img.src = objectUrl;
        });

        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;

        const context = canvas.getContext("2d", { alpha: false });
        if (!context) {
            throw new Error("Your browser could not prepare the image for Instagram.");
        }

        // Instagram Publishing API accepts JPEG images only.
        // Flatten transparency on white and re-encode to a normal RGB JPEG.
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(
                value => value ? resolve(value) : reject(new Error(`Could not convert image ${index} to JPEG.`)),
                "image/jpeg",
                0.95
            );
        });

        const filename = String(index).padStart(2, "0") + ".jpg";
        return new File([blob], filename, { type: "image/jpeg", lastModified: Date.now() });
    } finally {
        URL.revokeObjectURL(objectUrl);
    }
}

imageInput.addEventListener("change", function () {
    preview.innerHTML = "";
    setMessage("", "");
    Array.from(this.files).forEach(function (file) {
        const reader = new FileReader();
        reader.onload = function (event) {
            const img = document.createElement("img");
            img.src = event.target.result;
            preview.appendChild(img);
        };
        reader.readAsDataURL(file);
    });
});

generateButton.addEventListener("click", async function () {
    if (!imageInput.files.length) {
        setMessage("error", "Please select at least one image.");
        return;
    }

    const formData = new FormData();
    Array.from(imageInput.files).forEach(function (file) {
        formData.append("images", file, file.name);
    });

    generateButton.disabled = true;
    generateButton.textContent = "Generating with Gemini... ✨";
    setMessage("", "");

    try {
        const response = await fetch("/api/generate-content", {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || "Gemini generation failed.");
        }
        caption.value = data.caption || "";
        cta.value = data.cta || "";
        hashtags.value = data.hashtags || "";
        setMessage("success", "AI content generated successfully.");
    } catch (error) {
        console.error("Dashboard Gemini error:", error);
        setMessage("error", error.message);
    } finally {
        generateButton.disabled = false;
        generateButton.textContent = "Generate with Gemini ✨";
    }
});

approveButton.addEventListener("click", async function () {
    if (!imageInput.files.length) {
        setMessage("error", "Please select at least one image.");
        return;
    }
    if (!caption.value.trim()) {
        setMessage("error", "Generate or write a caption first.");
        return;
    }

    const formData = new FormData();

    try {
        const sourceFiles = Array.from(imageInput.files).slice(0, 10);

        for (let index = 0; index < sourceFiles.length; index++) {
            const jpegFile = await fileToInstagramJpeg(sourceFiles[index], index + 1);
            formData.append("images", jpegFile, jpegFile.name);
        }
    } catch (error) {
        console.error("JPEG conversion error:", error);
        setMessage("error", error.message || "Could not prepare the image for Instagram.");
        return;
    }

    formData.append("caption", caption.value);
    formData.append("cta", cta.value);
    formData.append("hashtags", hashtags.value);

    approveButton.disabled = true;
    approveButton.textContent = "Saving...";

    try {
        const response = await fetch("/api/approve-draft", {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || "Approval failed.");
        }
        setMessage("success", "Draft approved and saved ✓");
        currentDraftId = data.draft_id || "";
        approveButton.textContent = "Approved ✓";
        await loadDrafts();
    } catch (error) {
        console.error("Approve draft error:", error);
        setMessage("error", error.message);
        approveButton.disabled = false;
        approveButton.textContent = "Approve ✓";
    }
});

document.getElementById("rejectButton").addEventListener("click", function () {
    caption.value = "";
    cta.value = "";
    hashtags.value = "";
    approveButton.disabled = false;
    approveButton.textContent = "Approve ✓";
    setMessage("", "");
});

document.getElementById("scheduleButton").addEventListener("click", async function () {
    const button = this;
    const scheduleInput = document.getElementById("schedule");

    if (!currentDraftId) {
        setMessage("error", "Approve or select a draft first.");
        return;
    }

    if (!scheduleInput.value) {
        setMessage("error", "Choose the publish date and time first.");
        return;
    }

    const selectedDate = new Date(scheduleInput.value);
    if (Number.isNaN(selectedDate.getTime())) {
        setMessage("error", "Invalid publish date and time.");
        return;
    }

    if (selectedDate.getTime() <= Date.now()) {
        setMessage("error", "The scheduled time must be in the future.");
        return;
    }

    const confirmed = window.confirm(
        "Schedule this approved draft for " + scheduleInput.value.replace("T", " ") + " (Morocco time)?"
    );

    if (!confirmed) {
        return;
    }

    button.disabled = true;
    button.textContent = "Scheduling...";
    setMessage("", "");

    try {
        const response = await fetch("/api/schedule-draft", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                draft_id: currentDraftId,
                scheduled_for: scheduleInput.value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Scheduling failed.");
        }

        setMessage(
            "success",
            "Post scheduled successfully for " + scheduleInput.value.replace("T", " ") + " ✓"
        );

        currentDraftId = "";
        scheduleInput.value = "";
        approveButton.disabled = false;
        approveButton.textContent = "Approve ✓";
        await loadDrafts();

    } catch (error) {
        console.error("Schedule draft error:", error);
        setMessage("error", error.message);
    } finally {
        button.disabled = false;
        button.textContent = "Schedule Post";
    }
});

async function publishDraftNow(draftId, button = null) {
    if (!draftId) {
        setMessage("error", "Select a draft first.");
        return false;
    }

    const confirmed = window.confirm(
        "Publish this draft to Instagram now?"
    );

    if (!confirmed) return false;

    const originalText = button ? button.textContent : "";
    if (button) {
        button.disabled = true;
        button.textContent = "Publishing...";
    }

    setMessage("", "");

    try {
        const response = await fetch("/api/publish-draft", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ draft_id: draftId })
        });

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || "Instagram publishing failed.");
        }

        setMessage("success", "Published successfully on Instagram ✓");

        if (currentDraftId === draftId) currentDraftId = "";
        approveButton.disabled = false;
        approveButton.textContent = "Approve ✓";
        await loadDrafts();
        return true;

    } catch (error) {
        console.error("Publish draft error:", error);
        setMessage("error", error.message);
        return false;
    } finally {
        if (button) {
            button.disabled = false;
            button.textContent = originalText || "Publish Now";
        }
    }
}

async function cancelScheduledDraft(draftId, button) {
    if (!draftId) return;

    const confirmed = window.confirm(
        "Cancel this scheduled post and return it to Drafts?"
    );
    if (!confirmed) return;

    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = "Cancelling...";

    try {
        const response = await fetch("/api/cancel-schedule", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ draft_id: draftId })
        });

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || "Could not cancel the schedule.");
        }

        setMessage("success", "Schedule cancelled. Draft returned to Drafts ✓");
        await loadDrafts();

    } catch (error) {
        console.error("Cancel schedule error:", error);
        setMessage("error", error.message);
    } finally {
        button.disabled = false;
        button.textContent = originalText;
    }
}

function openReschedule(draft) {
    currentDraftId = draft.id || "";
    const scheduleInput = document.getElementById("schedule");

    if (draft.scheduled_local) {
        scheduleInput.value = String(draft.scheduled_local).slice(0, 16);
    }

    switchView("new");
    setMessage("success", "Scheduled post selected. Choose a new date/time and press Schedule Post.");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("publishButton").addEventListener("click", async function () {
    if (!currentDraftId) {
        setMessage("error", "Approve or select a draft first.");
        return;
    }

    await publishDraftNow(currentDraftId, this);
});

async function loadDrafts() {
    try {
        const response = await fetch("/api/drafts");
        const data = await response.json();
        cachedDrafts = Array.isArray(data.drafts) ? data.drafts : [];
        renderCurrentView();
    } catch (error) {
        console.error("Load drafts error:", error);
        draftsList.className = "empty-drafts";
        draftsList.textContent = "Could not load drafts.";
    }
}

function filteredDraftsForView() {
    if (currentView === "drafts") {
        return cachedDrafts.filter(d => ["approved", "schedule_failed"].includes(d.status || ""));
    }
    if (currentView === "scheduled") {
        return cachedDrafts.filter(d => d.status === "scheduled");
    }
    if (currentView === "published") {
        return cachedDrafts.filter(d => d.status === "published");
    }
    return cachedDrafts;
}

function renderPublishedList(items) {
    draftsList.className = "published-grid";
    draftsList.innerHTML = "";

    items.forEach(function (draft) {
        const card = document.createElement("article");
        card.className = "published-card";

        const image = document.createElement("img");
        image.className = "published-image";
        image.alt = "Published Instagram post";
        image.loading = "lazy";
        image.src = (Array.isArray(draft.image_urls) && draft.image_urls[0])
            ? draft.image_urls[0]
            : "";
        if (!image.src) image.style.display = "none";

        const body = document.createElement("div");
        body.className = "published-body";

        const captionText = document.createElement("div");
        captionText.className = "published-caption";
        captionText.textContent = draft.caption || "No caption";

        const meta = document.createElement("div");
        meta.className = "published-meta";

        const publishedLine = document.createElement("div");
        if (draft.published_at) {
            try { publishedLine.textContent = "Published: " + new Date(draft.published_at).toLocaleString(); }
            catch (e) { publishedLine.textContent = "Published"; }
        } else {
            publishedLine.textContent = "Published";
        }

        const idLine = document.createElement("div");
        idLine.textContent = "Instagram Media ID: " + (draft.instagram_media_id || "Unavailable");
        meta.appendChild(publishedLine);
        meta.appendChild(idLine);

        const actions = document.createElement("div");
        actions.className = "published-actions";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "Published";
        actions.appendChild(badge);

        const openButton = document.createElement("button");
        openButton.type = "button";
        openButton.className = "published-open";
        openButton.textContent = "View on Instagram";
        openButton.disabled = !draft.instagram_media_id;
        openButton.addEventListener("click", async function () {
            const originalText = openButton.textContent;
            openButton.disabled = true;
            openButton.textContent = "Opening...";
            try {
                let permalink = draft.instagram_permalink || "";
                if (!permalink) {
                    const response = await fetch(
                        "/api/published-permalink/" + encodeURIComponent(draft.id || "")
                    );
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || "Could not open Instagram post.");
                    permalink = data.permalink || "";
                    draft.instagram_permalink = permalink;
                }
                if (!permalink) throw new Error("Instagram permalink is unavailable.");
                window.open(permalink, "_blank", "noopener,noreferrer");
            } catch (error) {
                console.error("Open Instagram post error:", error);
                setMessage("error", error.message);
            } finally {
                openButton.disabled = !draft.instagram_media_id;
                openButton.textContent = originalText;
            }
        });
        actions.appendChild(openButton);

        body.appendChild(captionText);
        body.appendChild(meta);
        body.appendChild(actions);
        card.appendChild(image);
        card.appendChild(body);
        draftsList.appendChild(card);
    });
}

function renderDraftList(items) {
    if (!items.length) {
        draftsList.className = "empty-drafts";
        draftsList.textContent = "No items here yet.";
        return;
    }

    if (currentView === "published") {
        renderPublishedList(items);
        return;
    }

    draftsList.className = "";
    draftsList.innerHTML = "";

    items.forEach(function (draft) {
        const row = document.createElement("div");
        row.className = "draft";

        const content = document.createElement("div");
        content.className = "draft-content";

        const title = document.createElement("div");
        title.className = "draft-title";
        title.textContent = "Draft " + (draft.id || "");

        const text = document.createElement("div");
        text.className = "draft-caption";
        text.textContent = draft.caption || "No caption";

        const info = document.createElement("div");
        info.style.marginTop = "6px";
        info.style.fontSize = "12px";
        info.style.opacity = "0.72";

        if (draft.status === "scheduled" && draft.scheduled_local) {
            try { info.textContent = "Scheduled: " + new Date(draft.scheduled_local).toLocaleString(); }
            catch (e) { info.textContent = "Scheduled"; }
        } else if (draft.status === "published" && draft.published_at) {
            try { info.textContent = "Published: " + new Date(draft.published_at).toLocaleString(); }
            catch (e) { info.textContent = "Published"; }
        } else if (draft.status === "schedule_failed") {
            info.textContent = "Schedule failed: " + (draft.schedule_error || "Publishing failed");
            info.style.opacity = "1";
        } else if (draft.created_at) {
            try { info.textContent = "Created: " + new Date(draft.created_at).toLocaleString(); }
            catch (e) {}
        }

        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.alignItems = "center";
        actions.style.gap = "8px";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = draft.status || "approved";
        actions.appendChild(badge);

        if ((draft.status || "") === "scheduled") {
            const rescheduleButton = document.createElement("button");
            rescheduleButton.type = "button";
            rescheduleButton.textContent = "Reschedule";
            rescheduleButton.style.border = "0";
            rescheduleButton.style.borderRadius = "10px";
            rescheduleButton.style.padding = "8px 10px";
            rescheduleButton.style.cursor = "pointer";
            rescheduleButton.style.fontWeight = "700";
            rescheduleButton.addEventListener("click", function () {
                openReschedule(draft);
            });
            actions.appendChild(rescheduleButton);

            const publishNowButton = document.createElement("button");
            publishNowButton.type = "button";
            publishNowButton.textContent = "Publish Now";
            publishNowButton.style.border = "0";
            publishNowButton.style.borderRadius = "10px";
            publishNowButton.style.padding = "8px 10px";
            publishNowButton.style.cursor = "pointer";
            publishNowButton.style.fontWeight = "700";
            publishNowButton.addEventListener("click", async function () {
                await publishDraftNow(draft.id || "", publishNowButton);
            });
            actions.appendChild(publishNowButton);

            const cancelButton = document.createElement("button");
            cancelButton.type = "button";
            cancelButton.textContent = "Cancel";
            cancelButton.style.border = "1px solid #3a3a42";
            cancelButton.style.background = "transparent";
            cancelButton.style.color = "#ddd";
            cancelButton.style.borderRadius = "10px";
            cancelButton.style.padding = "8px 10px";
            cancelButton.style.cursor = "pointer";
            cancelButton.style.fontWeight = "700";
            cancelButton.addEventListener("click", async function () {
                await cancelScheduledDraft(draft.id || "", cancelButton);
            });
            actions.appendChild(cancelButton);
        }

        if (["approved", "schedule_failed"].includes(draft.status || "")) {
            const selectButton = document.createElement("button");
            selectButton.type = "button";
            selectButton.textContent = "Select";
            selectButton.style.border = "0";
            selectButton.style.borderRadius = "10px";
            selectButton.style.padding = "8px 10px";
            selectButton.style.cursor = "pointer";
            selectButton.style.fontWeight = "700";
            selectButton.addEventListener("click", function () {
                currentDraftId = draft.id || "";
                switchView("new");
                setMessage("success", "Draft selected. You can publish it now or schedule it.");
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
            actions.appendChild(selectButton);
        }

        content.appendChild(title);
        content.appendChild(text);
        if (info.textContent) content.appendChild(info);
        row.appendChild(content);
        row.appendChild(actions);
        draftsList.appendChild(row);
    });
}

function renderAnalytics() {
    const total = cachedDrafts.length;
    const drafts = cachedDrafts.filter(d => ["approved", "schedule_failed"].includes(d.status || "")).length;
    const scheduled = cachedDrafts.filter(d => d.status === "scheduled").length;
    const published = cachedDrafts.filter(d => d.status === "published").length;
    document.getElementById("statTotal").textContent = total;
    document.getElementById("statDrafts").textContent = drafts;
    document.getElementById("statScheduled").textContent = scheduled;
    document.getElementById("statPublished").textContent = published;
    const rate = total ? Math.round((published / total) * 100) : 0;
    document.getElementById("analyticsText").textContent =
        published + " published post(s), " + scheduled + " scheduled, " + drafts +
        " waiting/failed. Published share: " + rate + "% of recent dashboard items.";
}

function renderCurrentView() {
    const names = {
        dashboard: ["Content Dashboard", "Instagram automation • Online", "Recent Drafts"],
        new: ["New Post", "Create, approve, publish or schedule", "Recent Drafts"],
        drafts: ["Drafts", "Approved posts waiting for action", "Drafts"],
        scheduled: ["Scheduled", "Posts waiting for automatic publishing", "Scheduled Posts"],
        published: ["Published", "Posts successfully published to Instagram", "Published Posts"],
        analytics: ["Analytics", "Dashboard publishing overview", ""]
    };
    const meta = names[currentView] || names.dashboard;
    pageTitle.textContent = meta[0];
    pageSubtitle.textContent = meta[1];
    listTitle.textContent = meta[2] || "Recent Drafts";

    const showComposer = ["dashboard", "new"].includes(currentView);
    composerSection.classList.toggle("hidden", !showComposer);
    analyticsSection.classList.toggle("hidden", currentView !== "analytics");
    listSection.classList.toggle("hidden", currentView === "analytics");

    navButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.view === currentView));

    if (currentView === "analytics") renderAnalytics();
    else renderDraftList(filteredDraftsForView());
}

function switchView(view) {
    currentView = view || "dashboard";
    renderCurrentView();
}

navButtons.forEach(function (button) {
    button.addEventListener("click", function () {
        switchView(button.dataset.view);
        window.scrollTo({ top: 0, behavior: "smooth" });
    });
});

function updateScheduleMinimum() {
    const input = document.getElementById("schedule");
    if (!input) return;

    const now = new Date(Date.now() + 60000);
    const pad = value => String(value).padStart(2, "0");
    const localValue =
        now.getFullYear() + "-" +
        pad(now.getMonth() + 1) + "-" +
        pad(now.getDate()) + "T" +
        pad(now.getHours()) + ":" +
        pad(now.getMinutes());

    input.min = localValue;
}

updateScheduleMinimum();
setInterval(updateScheduleMinimum, 60000);
loadDrafts();
</script>
</body>
</html>
