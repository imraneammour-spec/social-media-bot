{% extends "app_base.html" %}

{% block title %}Automations{% endblock %}
{% block heading %}Automations{% endblock %}

{% block content %}

<section class="card page-stack">

    <p class="muted">Configure keyword-triggered responses for the selected account.</p>

    <form method="post">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <div class="checkbox-field">
            <input
                id="automation_enabled"
                type="checkbox"
                name="enabled"
                {% if automation.enabled %}checked{% endif %}
            >
            <label for="automation_enabled">Enabled</label>
        </div>

        <div>
            <label for="trigger_keywords">
                Trigger keywords
            </label>

            <input
                id="trigger_keywords"
                name="trigger_keywords"
                type="text"
                value="{{ automation.trigger_keywords | join(', ') }}"
            >
        </div>

        <div class="checkbox-field">
            <input
                id="public_reply_enabled"
                type="checkbox"
                name="public_reply_enabled"
                {% if automation.public_reply_enabled %}checked{% endif %}
            >
            <label for="public_reply_enabled">Public reply enabled</label>
        </div>

        <div>
            <label for="public_reply_text">
                Public reply text
            </label>

            <input
                id="public_reply_text"
                name="public_reply_text"
                type="text"
                value="{{ automation.public_reply_text }}"
            >
        </div>

        <button type="submit">
            Save
        </button>

    </form>

</section>

{% endblock %}
