<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Workspace{% endblock %} | Imran Prompts</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#0b0b0e; color:#f5f5f7; }
        body { margin:0; padding:24px; } main { max-width:960px; margin:auto; }
        nav, .account-list { display:flex; flex-wrap:wrap; gap:10px; margin:16px 0 24px; }
        a { color:#b9c7ff; } .card { background:#16161b; border:1px solid #30303a; border-radius:12px; padding:16px; margin:12px 0; }
        .active { border-color:#839dff; } .muted { color:#c4c6d0; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
        dt { color:#c4c6d0; } dd { margin:6px 0 0; font-size:1.25rem; }
    </style>
</head>
<body>
    <main>
        <h1>{% block heading %}Instagram workspace{% endblock %}</h1>
        <p class="muted">{{ current_user.display_name }}, viewing {{ selected_account.username }}.</p>
        <nav aria-label="Workspace sections">
            <a href="{{ url_for('tenant_dashboard.app_overview', account=selected_account.selection_ref) }}">Overview</a>
            <a href="{{ url_for('tenant_dashboard.app_accounts', account=selected_account.selection_ref) }}">Accounts</a>
            <a href="{{ url_for('tenant_dashboard.app_leads', account=selected_account.selection_ref) }}">Leads</a>
            <a href="{{ url_for('tenant_dashboard.app_activity', account=selected_account.selection_ref) }}">Activity</a>
            <a href="{{ url_for('tenant_dashboard.app_followups', account=selected_account.selection_ref) }}">Follow-ups</a>
        </nav>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
