name: Verify Postenza
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postenza_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTENZA_EMBEDDED_SCHEDULER: 'false'
      POSTENZA_DATA_DIR: /tmp/postenza-test-data
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/postenza_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q auth.py webhook.py billing.py operations.py seo.py worker.py wsgi.py database
      - name: Apply the full migration chain on PostgreSQL
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python -m alembic upgrade head
      - run: python -m pytest recovery_tests -q
      - run: python -m pip_audit -r requirements.txt
      - run: docker build -t postenza:check .
